# Codelijsten met bron Semantic Treehouse (niet uit codelist.xsd, en xsd wordt hiervoor niet bijgewerkt).
# Opgehaald 01-07-2026 van https://ketenstandaard.semantic-treehouse.nl/codelist -- controleer bij twijfel de URI opnieuw.
    MaintenanceType:
      description: "Bron: Semantic Treehouse (https://www.ketenstandaard.nl/codelist/dico/MaintenanceType)."
      type: string
      enum:
        - "MUT"
        - "REN"
        - "PLM"
        - "REP"
        - "PRE"
        - "INS"
        - "OFR"
    "MaintenanceType.Display":
      description: "MaintenanceType met omschrijvingen (documentatie, niet voor validatie, zie D22). Bron: Semantic Treehouse (https://www.ketenstandaard.nl/codelist/dico/MaintenanceType)."
      oneOf:
        - const: "MUT"
          title: "Turnover maintenance"
          x-titleNl: "Mutatie"
          description: "Maintenance work carried out when a tenant moves out (turnover maintenance), to make the home ready for a new occupant."
          x-descriptionNl: "Onderhoudswerkzaamheden die worden uitgevoerd bij vertrek van de huurder (mutatieonderhoud), om de woning gereed te maken voor een nieuwe bewoner."
        - const: "REN"
          title: "Renovation"
          x-titleNl: "Renovatie"
          description: "Large-scale conversion or renovation of a home or object, often to improve its condition or to modernise it."
          x-descriptionNl: "Grootschalige verbouwing of renovatie van een woning of object, vaak om de staat te verbeteren of te moderniseren."
        - const: "PLM"
          title: "Planned maintenance"
          x-titleNl: "Planmatig onderhoud"
          description: "Planned maintenance according to a predefined maintenance plan, to prevent unexpected defects and extend service life."
          x-descriptionNl: "Planmatig onderhoud volgens een vooraf opgesteld onderhoudsplan, om onverwachte gebreken te voorkomen en de levensduur te verlengen."
        - const: "REP"
          title: "Repair"
          x-titleNl: "Reparatie"
          description: "Repair work on a defect or fault reported by the tenant or user."
          x-descriptionNl: "Herstelwerkzaamheden aan een gebrek of defect dat is gemeld door de huurder of gebruiker."
        - const: "PRE"
          title: "Preventive maintenance"
          x-titleNl: "Preventief onderhoud"
          description: "Preventive maintenance according to a predefined maintenance plan, to prevent unexpected defects and extend service life."
          x-descriptionNl: "Preventief onderhoud volgens een vooraf opgesteld onderhoudsplan, om onverwachte gebreken te voorkomen en de levensduur te verlengen."
        - const: "INS"
          title: "Inspection"
          x-titleNl: "Inspectie"
          description: "Inspection of the home or object to determine its condition and identify any defects."
          x-descriptionNl: "Inspectie van de woning of het object om de staat vast te stellen en eventuele gebreken te identificeren."
        - const: "OFR"
          title: "Quotation"
          x-titleNl: "Offerte"
          description: "A quotation request for work where the costs must be calculated and approved in advance. This explicitly concerns items for which no price is known yet or can be known (for example via a price book)."
          x-descriptionNl: "Een offerte-aanvraag voor werkzaamheden waarbij de kosten vooraf moeten worden berekend en goedgekeurd. Het gaat expliciet om zaken waarvan nog geen prijs bekend is of kan zijn (bijvoorbeeld via een prijzenboek)."
